[project]
name = "hiringcafe-cli"
version = "0.1.4"
description = "Spec-driven Python CLI for Hiring Cafe job search and saved-job tracking"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "chen-gdp", email = "146709874+chen-gdp@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/chen-gdp/hiringcafe-cli"
Repository = "https://github.com/chen-gdp/hiringcafe-cli"
Issues = "https://github.com/chen-gdp/hiringcafe-cli/issues"
Changelog = "https://github.com/chen-gdp/hiringcafe-cli/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pre-commit>=4.3.0",
    "pytest>=9.0.0",
    "ruff>=0.14.0",
]

[project.scripts]
hiringcafe = "hiringcafe_cli:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = [
    "S310", # all transport URLs are fixed HTTPS constants or verified site URLs
    "S311", # random jitter is for retry timing, not cryptography
    "UP017", # timezone.utc is the Python 3.11-compatible spelling
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101", # assertions are the project's test contract
    "S105", # synthetic credential names in isolated tests
    "S106", # synthetic credential values in isolated tests
]
